---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: 5522922+ymedlop@users.noreply.github.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
    - http01:
        ingress:
          class: traefik
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-gtw-tls
  namespace: kube-system
spec:
  secretName: argocd-gtw-tls
  dnsNames:
  - "argocd.homelab.local"
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
