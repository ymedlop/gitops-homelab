fullnameOverride: kube-prometheus-stack

grafana:
  enabled: true
  defaultDashboardsEnabled: true
  admin:
    existingSecret: monitoring-grafana
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
  persistence:
    enabled: true
    storageClassName: ugreen-nfs
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  nodeSelector:
    kubernetes.io/hostname: k3s-gengar
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    nodeSelector:
      kubernetes.io/hostname: k3s-gengar
    retention: 15d
    retentionSize: 20GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ugreen-nfs
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        cpu: 1000m
        memory: 2Gi

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "telegram-slack"
    receivers:
      - name: "telegram-slack"
        slack_configs:
          - api_url_file: /etc/secrets/SLACK_WEBHOOK_URL
            channel: "#homelab-alerts"
        # telegram_configs:
        #   - bot_token: "SUS_BOT_TOKEN"  # Placeholder
        #     chat_id: -SUS_CHAT_ID
  service:
    type: ClusterIP
  alertmanagerSpec:
    secrets:
      - alertmanager-secrets
    nodeSelector:
      kubernetes.io/hostname: k3s-gengar
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: ugreen-nfs
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

kube-state-metrics:
  nodeSelector:
    kubernetes.io/hostname: k3s-gengar
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheusOperator:
  nodeSelector:
    kubernetes.io/hostname: k3s-gengar
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    configReloaders: true
    general: true
    k8sContainerCpuUsageSecondsTotal: true
    k8sContainerMemoryCache: true
    k8sContainerMemoryRss: true
    k8sContainerMemorySwap: false
    k8sContainerResource: true
    k8sContainerMemoryWorkingSetBytes: true
    k8sPodOwner: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: false
    kubelet: true
    kubeProxy: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    