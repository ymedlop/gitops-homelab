apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nfs-system

helmGlobals:
 chartHome: ../../../../../charts

helmCharts:
# hhttps://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
- name: nfs-subdir-external-provisioner
  includeCRDs: true
  repo: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner
  version: 4.0.18
  valuesInline:
    nfs:
      server: 192.168.1.62
      path: /volume1/k3s
    storageClass:
      create: true
      name: ugreen-nfs
      defaultClass: false
    replicaCount: 1
